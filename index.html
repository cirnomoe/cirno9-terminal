<!DOCTYPE html>
<html lang="zh-CN" data-theme="cirno">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="cirno@cirno9.moe - 极客终端交互主页 (Web CLI)" />
    <meta name="theme-color" content="#090d16" />
    <title>cirno@cirno9.moe:~</title>
  </head>
  <body>
    <div id="crt-overlay" aria-hidden="true"></div>
    <main id="terminal" role="application" aria-label="Cirno Web CLI Terminal">
      <header class="terminal-header" aria-hidden="true">
        <div class="terminal-buttons">
          <span class="btn-dot btn-close"></span>
          <span class="btn-dot btn-minimize"></span>
          <span class="btn-dot btn-maximize"></span>
        </div>
        <div class="terminal-title" id="terminal-title">cirno@cirno9.moe: ~</div>
        <div class="terminal-badge">⑨ ICE-TTY</div>
      </header>

      <div id="terminal-viewport" class="terminal-viewport">
        <div id="terminal-output" class="terminal-output" aria-live="polite"></div>

        <div id="terminal-input-line" class="terminal-input-line"><span id="terminal-prompt" class="terminal-prompt">cirno@cirno9.moe:~$ </span><span class="input-mirror-wrapper"><span id="input-before" class="input-text"></span><span id="terminal-cursor" class="terminal-cursor">_</span><span id="input-after" class="input-text"></span></span><input
            id="terminal-input"
            class="terminal-hidden-input"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            aria-label="Terminal Command Input"
            autofocus
          /></div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
